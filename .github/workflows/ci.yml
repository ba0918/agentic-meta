name: CI

# push is limited to main so a branch with an open PR runs once (via
# pull_request), not twice.
on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository, so the token is held to
# read access instead of the repository default.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # --frozen-lockfile is the only mode that enforces the lockfile's
      # integrity hashes, and it runs before self-test on purpose: the bytes of
      # the vendoring tool are established by the lockfile first, so the tool
      # is never the sole witness to its own provenance.
      - name: Install the pinned toolchain
        run: bun install --frozen-lockfile

      - name: Check the vendoring tool against its own vectors
        run: bunx agentic-skill-vendor self-test

      # CI never runs gen. Its job is detecting a tree that disagrees with its
      # lock, not resolving the disagreement.
      - name: Verify the fixture trees against their locks
        run: |
          bunx agentic-skill-vendor verify --root fixtures/skillset-alpha
          bunx agentic-skill-vendor verify --root fixtures/skillset-beta

      - name: Lint the fixture trees for self-containment
        run: |
          bunx agentic-skill-vendor lint-selfcontain --root fixtures/skillset-alpha
          bunx agentic-skill-vendor lint-selfcontain --root fixtures/skillset-beta
