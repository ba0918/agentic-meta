name: CI

# push is limited to main so a branch with an open PR runs once (via
# pull_request), not twice.
on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository, so the token is held to
# read access instead of the repository default.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Minor-series pin, the same shape the sister repositories use, so a
          # runtime major update cannot change CI behavior on its own.
          bun-version: "1.3.x"

      # --frozen-lockfile refuses to rewrite the lockfile, so the integrity
      # hashes enforced here are the recorded ones rather than whatever a fresh
      # resolution would produce. It runs before self-test on purpose: the bytes
      # of the vendoring tool are established by the lockfile first, so the tool
      # is never the sole witness to its own provenance.
      - name: Install the pinned toolchain
        run: bun install --frozen-lockfile

      # The steps below name the installed path rather than running
      # `bunx agentic-skill-vendor`. bunx falls back to fetching from the
      # registry when the local install is missing, and it would fetch the
      # unscoped name `agentic-skill-vendor` — a different package from the
      # pinned `@ba0918-dev/agentic-skill-vendor`. A path cannot resolve
      # anywhere but the install produced by the step above, so a broken
      # install fails the job instead of silently reaching the network.
      - name: Check the vendoring tool against its own vectors
        run: bun ./node_modules/.bin/agentic-skill-vendor self-test

      # CI never runs gen. Its job is detecting a tree that disagrees with its
      # lock, not resolving the disagreement.
      - name: Verify the fixture trees against their locks
        run: |
          bun ./node_modules/.bin/agentic-skill-vendor verify --root fixtures/skillset-alpha
          bun ./node_modules/.bin/agentic-skill-vendor verify --root fixtures/skillset-beta

      - name: Lint the fixture trees for self-containment
        run: |
          bun ./node_modules/.bin/agentic-skill-vendor lint-selfcontain --root fixtures/skillset-alpha
          bun ./node_modules/.bin/agentic-skill-vendor lint-selfcontain --root fixtures/skillset-beta
