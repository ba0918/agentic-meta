name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Nothing in this workflow writes to the repository, so the token is held to
# read access instead of the repository default.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the vendor tool's own tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest tests/ -q

      # The bad-* trees under fixtures/contracts-basic/ are deliberately
      # broken (the pytest suite proves they fail); direct invocations below
      # therefore target only the known-good trees.
      - name: Verify the good fixture trees regenerate without drift
        run: |
          python scripts/vendor.py verify --root fixtures/contracts-basic/good
          python scripts/vendor.py verify --root fixtures/skillset-alpha
          python scripts/vendor.py verify --root fixtures/skillset-beta

      - name: Lint the good fixture trees for self-containment
        run: |
          python scripts/vendor.py lint-selfcontain --root fixtures/contracts-basic/good
          python scripts/vendor.py lint-selfcontain --root fixtures/skillset-alpha
          python scripts/vendor.py lint-selfcontain --root fixtures/skillset-beta

      - name: Run the fixture contract's conformance tests
        run: python -m pytest fixtures/contracts-basic/good/contracts/report-format/conformance -q
