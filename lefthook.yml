# Local quality gates, mirroring CI ahead of push. Activate once per clone:
#   lefthook install
# CI remains the authority; the hook guards on the toolchain being present so
# it stays inert in a clone where dependencies have not been installed.
pre-push:
  commands:
    vendor-verify:
      run: |
        # Without set -e the block would exit with the status of its last
        # command, so an earlier failing check would pass the hook silently.
        set -e
        if ! command -v bunx >/dev/null 2>&1; then
          echo "lefthook: bunx not found - skipping vendor checks"
        elif [ ! -d node_modules ]; then
          echo "lefthook: dependencies not installed (run bun install) - skipping vendor checks"
        else
          bunx agentic-skill-vendor verify --root fixtures/skillset-alpha
          bunx agentic-skill-vendor verify --root fixtures/skillset-beta
          bunx agentic-skill-vendor lint-selfcontain --root fixtures/skillset-alpha
          bunx agentic-skill-vendor lint-selfcontain --root fixtures/skillset-beta
        fi
