# Local quality gates, mirroring CI ahead of push. Activate once per clone:
#   lefthook install
# CI remains the authority; the hook guards on each toolchain being present so
# it stays inert in a clone where dependencies have not been installed.
pre-push:
  commands:
    checks:
      run: |
        # Without set -e the block would exit with the status of its last
        # command, so an earlier failing check would pass the hook silently.
        set -e
        # The installed path is named rather than running
        # `bunx agentic-skill-vendor`. bunx falls back to fetching from the
        # registry when the local install is missing, and it would fetch the
        # unscoped name `agentic-skill-vendor` — a different package from the
        # pinned `@ba0918-dev/agentic-skill-vendor`. A path cannot resolve
        # anywhere but the pinned install, which turns "not installed" into a
        # skip that says so instead of a silent network fetch.
        vendor=./node_modules/.bin/agentic-skill-vendor
        if ! command -v bun >/dev/null 2>&1; then
          echo "lefthook: bun not found - skipping vendor checks"
        # -f, not -x: the launch is `bun "$vendor"`, which only reads the file,
        # so requiring an exec bit would silently skip a usable install.
        elif [ ! -f "$vendor" ]; then
          echo "lefthook: $vendor not installed (run bun install --frozen-lockfile) - skipping vendor checks"
        else
          bun "$vendor" verify --root fixtures/skillset-alpha
          bun "$vendor" verify --root fixtures/skillset-beta
          bun "$vendor" verify --root .
          bun "$vendor" lint-selfcontain --root fixtures/skillset-alpha
          bun "$vendor" lint-selfcontain --root fixtures/skillset-beta
          bun "$vendor" lint-selfcontain --root .
        fi
        # uv is guarded separately from bun: a clone without uv still owes the
        # vendor checks above, so one missing toolchain must not skip the other.
        #
        # The suites run after the lint, never before, and with bytecode writing
        # off. lint-selfcontain reads the working tree, and .pyc files under
        # skills/*/scripts/__pycache__/ are reported as absolute-path violations
        # — which, in a tree that survives between pushes, would otherwise fail
        # the next push rather than this one.
        if ! command -v uv >/dev/null 2>&1; then
          echo "lefthook: uv not found - skipping the skills' script suites"
        else
          PYTHONDONTWRITEBYTECODE=1 uv run --with pytest pytest skills -q
        fi
        # marketplace.json repeats the version canonically declared in
        # plugin.json, so it can only ever follow. CI runs this same comparison,
        # but only after the push — a disagreement pushed to a shared branch is
        # already published by then.
        if ! command -v jq >/dev/null 2>&1; then
          echo "lefthook: jq not found - skipping the plugin version check"
        else
          canonical=$(jq -r .version .claude-plugin/plugin.json)
          follower=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          test "$canonical" = "$follower" || {
            echo "plugin.json declares $canonical, marketplace.json declares $follower"
            exit 1
          }
        fi
